<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lay Chérubin — Riddle Master</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #07130d;
      color: #f5e7b2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .crown {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 42px;
      color: #f5d76e;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #d7c98b;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .card {
      background: linear-gradient(145deg, #0d2116, #07130d);
      border: 1px solid #b99b3e;
      border-radius: 20px;
      padding: 30px 22px;
      box-shadow: 0 0 30px rgba(210, 175, 65, 0.15);
      margin-bottom: 25px;
    }

    .title {
      font-size: 25px;
      color: #f5d76e;
      margin-bottom: 25px;
    }

    .riddle {
      text-align: left;
      line-height: 1.8;
      font-size: 18px;
    }

    .riddle p {
      margin-bottom: 14px;
    }

    .question {
      margin-top: 25px;
      padding: 18px;
      border-left: 4px solid #f5d76e;
      background: rgba(245, 215, 110, 0.06);
      font-size: 20px;
      font-weight: bold;
    }

    .button {
      margin-top: 25px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: #f5d76e;
      color: #07130d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .button:hover {
      transform: scale(1.03);
    }

    #answer {
      display: none;
      margin-top: 22px;
      font-size: 30px;
      color: #f5d76e;
      font-weight: bold;
    }
